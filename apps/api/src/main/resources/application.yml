server:
  port: ${PORT:8280}

spring:
  application:
    name: business-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/business_platform}
    username: ${DATABASE_USERNAME:bizplat}
    password: ${DATABASE_PASSWORD:bizplat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

platform:
  # local | production. Production refuses to start with local-only settings (see ProductionSafety).
  environment: ${PLATFORM_ENV:local}
  auth:
    # Required outside local: at least 32 random bytes, Base64 (openssl rand -base64 48).
    jwt-secret: ${PLATFORM_JWT_SECRET:bG9jYWwtZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0wMTIzNDU2Nzg5YWJjZGVm}
    access-ttl: ${PLATFORM_ACCESS_TTL:PT15M}
    refresh-ttl: ${PLATFORM_REFRESH_TTL:P30D}
    cookie-secure: ${PLATFORM_COOKIE_SECURE:false}
    # New accounts must open the emailed link before they create an organisation or invite people.
    require-verified-email: ${PLATFORM_AUTH_REQUIRE_VERIFIED_EMAIL:true}
  files:
    dir: ${PLATFORM_FILES_DIR:./data/files}
  app-url: ${PLATFORM_APP_URL:http://localhost:3300}
  # The Terms of Service / Privacy Policy version recorded at sign-up; keep it equal to the web app's LEGAL_VERSION.
  legal-version: ${PLATFORM_LEGAL_VERSION:2026-11-02}
  # Emails (comma-separated) that become super admins (the platform console at /admin) on sign-up or start-up.
  super-admins: ${PLATFORM_SUPER_ADMINS:}
  # Email (invitations, password resets). Without a host, emails are only logged.
  mail:
    host: ${PLATFORM_MAIL_HOST:}
    port: ${PLATFORM_MAIL_PORT:}
    username: ${PLATFORM_MAIL_USERNAME:}
    password: ${PLATFORM_MAIL_PASSWORD:}
    from: ${PLATFORM_MAIL_FROM:Business Platform <no-reply@localhost>}
    # starttls (587) | ssl (465) | none
    security: ${PLATFORM_MAIL_SECURITY:starttls}
    # Development/test servers on a real mailbox: only these addresses (comma-separated) get real email.
    only-to: ${PLATFORM_MAIL_ONLY_TO:}
    # Never email these addresses, domains or domain endings, whatever else is set: reserved test domains by default,
    # so made-up accounts (imports, demos, tests) never bounce back into the sending mailbox.
    never-to: ${PLATFORM_MAIL_NEVER_TO:.test,.example,.invalid,.localhost,example.com,example.org,example.net}

  # SaaS billing (docs/ops/billing.md): the seller on invoices, how to pay, when invoices are due and the grace period.
  billing:
    seller-name: ${PLATFORM_BILLING_SELLER_NAME:Business Platform}
    seller-address: ${PLATFORM_BILLING_SELLER_ADDRESS:Phnom Penh, Cambodia}
    seller-tax-id: ${PLATFORM_BILLING_SELLER_TAX_ID:}
    bank-name: ${PLATFORM_BILLING_BANK_NAME:}
    bank-account-name: ${PLATFORM_BILLING_BANK_ACCOUNT_NAME:}
    bank-account-number: ${PLATFORM_BILLING_BANK_ACCOUNT_NUMBER:}
    # A Bakong account ID (name@bank) makes every invoice carry a KHQR code for its amount.
    bakong-account-id: ${PLATFORM_BILLING_BAKONG_ACCOUNT_ID:}
    merchant-city: ${PLATFORM_BILLING_MERCHANT_CITY:Phnom Penh}
    due-days: ${PLATFORM_BILLING_DUE_DAYS:7}
    grace-days: ${PLATFORM_BILLING_GRACE_DAYS:14}

  # OpenID Connect provider for VirtualBiz single sign-on (docs/integrations/virtualbiz-sso.md).
  oidc:
    # RSA private key, PKCS#8 PEM, base64-encoded (see README). Generated at start-up when environment=local.
    signing-key: ${PLATFORM_OIDC_SIGNING_KEY:}
    # JSON array: [{"id":"virtualbiz","name":"VirtualBiz","secretHash":"<sha-256 hex>","redirectUris":["https://…/platform/callback"]}]
    clients-json: ${PLATFORM_OIDC_CLIENTS:}
  # VirtualBiz's web origin; the Retail & Commerce module is available only when set.
  virtualbiz:
    url: ${PLATFORM_VIRTUALBIZ_URL:}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
