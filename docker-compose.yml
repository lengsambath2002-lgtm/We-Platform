# Runs the whole platform locally: PostgreSQL, the API and the web app.
#   cp .env.example .env   # then set PLATFORM_JWT_SECRET
#   docker compose up --build
# Web: http://localhost:3300 · API docs: http://localhost:8280/api/docs/ui
name: business-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: business_platform
      POSTGRES_USER: bizplat
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizplat -d business_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/business_platform
      DATABASE_USERNAME: bizplat
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PLATFORM_ENV: ${PLATFORM_ENV:-local}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env (openssl rand -base64 48)}
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-false}
      PLATFORM_APP_URL: ${PLATFORM_APP_URL:-http://localhost:3300}
      PLATFORM_SUPER_ADMINS: ${PLATFORM_SUPER_ADMINS:-}
      PLATFORM_MAIL_HOST: ${PLATFORM_MAIL_HOST:-}
      PLATFORM_MAIL_PORT: ${PLATFORM_MAIL_PORT:-}
      PLATFORM_MAIL_USERNAME: ${PLATFORM_MAIL_USERNAME:-}
      PLATFORM_MAIL_PASSWORD: ${PLATFORM_MAIL_PASSWORD:-}
      PLATFORM_MAIL_FROM: ${PLATFORM_MAIL_FROM:-Business Platform <no-reply@localhost>}
      PLATFORM_MAIL_SECURITY: ${PLATFORM_MAIL_SECURITY:-starttls}
      PLATFORM_MAIL_ONLY_TO: ${PLATFORM_MAIL_ONLY_TO:-}
      PLATFORM_MAIL_NEVER_TO: ${PLATFORM_MAIL_NEVER_TO:-.test,.example,.invalid,.localhost,example.com,example.org,example.net}
      PLATFORM_OIDC_SIGNING_KEY: ${PLATFORM_OIDC_SIGNING_KEY:-}
      PLATFORM_OIDC_CLIENTS: ${PLATFORM_OIDC_CLIENTS:-}
      PLATFORM_VIRTUALBIZ_URL: ${PLATFORM_VIRTUALBIZ_URL:-}
      PLATFORM_AUTH_REQUIRE_VERIFIED_EMAIL: ${PLATFORM_AUTH_REQUIRE_VERIFIED_EMAIL:-true}
      PLATFORM_LEGAL_VERSION: ${PLATFORM_LEGAL_VERSION:-2026-11-02}
      PLATFORM_BILLING_SELLER_NAME: ${PLATFORM_BILLING_SELLER_NAME:-Business Platform}
      PLATFORM_BILLING_SELLER_ADDRESS: ${PLATFORM_BILLING_SELLER_ADDRESS:-Phnom Penh, Cambodia}
      PLATFORM_BILLING_SELLER_TAX_ID: ${PLATFORM_BILLING_SELLER_TAX_ID:-}
      PLATFORM_BILLING_BANK_NAME: ${PLATFORM_BILLING_BANK_NAME:-}
      PLATFORM_BILLING_BANK_ACCOUNT_NAME: ${PLATFORM_BILLING_BANK_ACCOUNT_NAME:-}
      PLATFORM_BILLING_BANK_ACCOUNT_NUMBER: ${PLATFORM_BILLING_BANK_ACCOUNT_NUMBER:-}
      PLATFORM_BILLING_BAKONG_ACCOUNT_ID: ${PLATFORM_BILLING_BAKONG_ACCOUNT_ID:-}
    volumes:
      - files:/data/files
    ports:
      - "8280:8280"

  # Daily backups (docs/ops/backups.md): database + uploaded files into the backups volume, kept 30 days.
  # 19:00 UTC = 02:00 in Phnom Penh. Run one now: docker compose exec backup sh /ops/backup.sh
  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: bizplat
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: business_platform
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - files:/data/files:ro
      - backups:/backups
      - ./ops/backup:/ops:ro
    entrypoint: ["/bin/sh", "-c", "echo '${BACKUP_SCHEDULE:-0 19 * * *} /bin/sh /ops/backup.sh > /proc/1/fd/1 2>&1' | crontab - && exec crond -f -l 8"]

  # Catches every email locally (nothing reaches a real inbox): http://localhost:8025.
  # Point the API at it with PLATFORM_MAIL_HOST=mailpit, PLATFORM_MAIL_PORT=1025, PLATFORM_MAIL_SECURITY=none.
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8280
        NEXT_PUBLIC_LEGAL_NAME: ${LEGAL_NAME:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
        NEXT_PUBLIC_LEGAL_EMAIL: ${LEGAL_EMAIL:-}
    depends_on:
      - api
    ports:
      - "3300:3300"

volumes:
  db-data:
  files:
  backups:
